# Local development and integration-test infrastructure.
#
# Production uses Supabase-hosted PostgreSQL; this compose file exists so the
# same migrations and integration tests can run offline and in CI.

services:
  postgres:
    image: postgres:17-alpine
    container_name: meracare-postgres
    environment:
      POSTGRES_USER: meracare
      POSTGRES_PASSWORD: meracare
      POSTGRES_DB: meracare
    # Host port 55432 keeps MeraCare clear of any default Postgres on 5432.
    ports:
      - '55432:5432'
    volumes:
      - meracare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meracare -d meracare']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meracare-postgres-data:
